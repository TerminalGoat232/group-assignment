<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Job Application Form</title>
    <!-- CSS chung của nhóm & CSS riêng cho trang apply -->
    <link rel="stylesheet" href="colorscheme.css">
    <link rel="stylesheet" href="apply.css">
</head>
<body>

    <h1>Job Application Form</h1>

    <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
        
        <!-- Job Reference Number -->
        <label for="jobref">Job Reference Number:</label>
        <input type="text" id="jobref" name="jobref" pattern="[A-Za-z0-9]{5}" required><br><br>

        <!-- First Name -->
        <label for="firstname">First Name:</label>
        <input type="text" id="firstname" name="firstname" maxlength="20" pattern="[A-Za-z\s]+" required><br><br>

        <!-- Last Name -->
        <label for="lastname">Last Name:</label>
        <input type="text" id="lastname" name="lastname" maxlength="20" pattern="[A-Za-z\s]+" required><br><br>

        <!-- Date of Birth -->
        <label for="dob">Date of Birth:</label>
        <input type="date" id="dob" name="dob" required><br><br>

        <!-- Gender -->
        <fieldset>
            <legend>Gender</legend>
            <label><input type="radio" name="gender" value="male" required> Male</label>
            <label><input type="radio" name="gender" value="female" required> Female</label>
            <label><input type="radio" name="gender" value="other" required> Other</label>
        </fieldset><br>

        <!-- Street Address -->
        <label for="street">Street Address:</label>
        <input type="text" id="street" name="street" maxlength="40" required><br><br>

        <!-- Suburb / Town -->
        <label for="suburb">Suburb / Town:</label>
        <input type="text" id="suburb" name="suburb" maxlength="40" required><br><br>

        <!-- State -->
        <label for="state">State:</label>
        <select id="state" name="state" required>
            <option value="">Please Select</option>
            <option value="VIC">VIC</option>
            <option value="NSW">NSW</option>
            <option value="QLD">QLD</option>
            <option value="NT">NT</option>
            <option value="WA">WA</option>
            <option value="SA">SA</option>
            <option value="TAS">TAS</option>
            <option value="ACT">ACT</option>
        </select><br><br>

        <!-- Postcode -->
        <label for="postcode">Postcode:</label>
        <input type="text" id="postcode" name="postcode" pattern="[0-9]{4}" maxlength="4" required><br><br>

        <!-- Email -->
        <label for="email">Email Address:</label>
        <input type="email" id="email" name="email" required><br><br>

        <!-- Phone Number -->
        <label for="phone">Phone Number:</label>
        <input type="tel" id="phone" name="phone" pattern="[0-9]{8,12}" required><br><br>

        <!-- Skill List -->
        <fieldset>
            <legend>Skill List</legend>
            <label><input type="checkbox" name="skills[]" value="HTML"> HTML</label>
            <label><input type="checkbox" name="skills[]" value="CSS"> CSS</label>
            <label><input type="checkbox" name="skills[]" value="JavaScript"> JavaScript</label>
            <label><input type="checkbox" name="skills[]" value="PHP"> PHP</label>
        </fieldset><br>

        <!-- Other Skills -->
        <label for="otherskills">Other Skills:</label><br>
        <textarea id="otherskills" name="otherskills" rows="4" cols="50"></textarea><br><br>

        <!-- Submit Button -->
        <input type="submit" value="Apply">
        <input type="reset" value="Reset">

    </form>

    <br><hr>

    <!-- Acknowledgement of Country -->
    <footer>
        <p>We acknowledge the Aboriginal and Torres Strait Islander peoples as the Traditional Custodians of the land on which we work and learn, and pay our respects to Elders past, present, and emerging.</p>
    </footer>

</body>
</html>
