        <nav>

            <a href="index.html">Home</a>
            <a href="about.html">About us</a>
            <a href="apply.html" aria-current="page">Join us</a>
            <a href="jobs.html">Jobs</a>
        </nav>
    </header>

    <main>
        <h1>Job Application Form</h1>

        <form action="https://mercury.swin.edu.au/it000000/formtest.php" method="post">
            
            <div class="form-group">
                <label for="jobref">Job Reference Number:</label>
                <input type="text" id="jobref" name="jobref" pattern="[A-Za-z0-9]{5}" required>
            </div>

            <div class="form-group">
                <label for="firstname">First Name:</label>
                <input type="text" id="firstname" name="firstname" maxlength="20" pattern="[A-Za-z\s]+" required>
            </div>

            <div class="form-group">
                <label for="lastname">Last Name:</label>
                <input type="text" id="lastname" name="lastname" maxlength="20" pattern="[A-Za-z\s]+" required>
            </div>

            <div class="form-group">
                <label for="dob">Date of Birth:</label>
                <input type="date" id="dob" name="dob" required>
            </div>

            <fieldset>
                <legend>Gender</legend>
                <label><input type="radio" name="gender" value="male" required> Male</label>
                <label><input type="radio" name="gender" value="female" required> Female</label>
                <label><input type="radio" name="gender" value="other" required> Other</label>
            </fieldset>

            <div class="form-group">
                <label for="street">Street Address:</label>
                <input type="text" id="street" name="street" maxlength="40" required>
            </div>

            <div class="form-group">
                <label for="suburb">Suburb / Town:</label>
                <input type="text" id="suburb" name="suburb" maxlength="40" required>
            </div>

            <div class="form-group">
                <label for="state">State:</label>
                <select id="state" name="state" required>
                    <option value="">Please Select</option>
                    <option value="VIC">VIC</option>
                    <option value="NSW">NSW</option>
                    <option value="QLD">QLD</option>
                    <option value="NT">NT</option>
                    <option value="WA">WA</option>
                    <option value="SA">SA</option>
                    <option value="TAS">TAS</option>
                    <option value="ACT">ACT</option>
                </select>
            </div>

            <div class="form-group">
                <label for="postcode">Postcode:</label>
                <input type="text" id="postcode" name="postcode" pattern="[0-9]{4}" maxlength="4" required>
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required>
            </div>

            <div class="form-group">
                <label for="phone">Phone Number:</label>
                <input type="tel" id="phone" name="phone" pattern="[0-9]{8,12}" required>
            </div>

            <fieldset>
                <legend>Skill List</legend>
                <label><input type="checkbox" name="skills[]" value="HTML"> HTML</label>
                <label><input type="checkbox" name="skills[]" value="CSS"> CSS</label>
                <label><input type="checkbox" name="skills[]" value="JavaScript"> JavaScript</label>
                <label><input type="checkbox" name="skills[]" value="PHP"> PHP</label>
            </fieldset>

            <div class="form-group">
                <label for="otherskills">Other Skills:</label>
                <textarea id="otherskills" name="otherskills" rows="4"></textarea>
            </div>

            <div class="button-group">
                <input type="submit" value="Apply">
                <input type="reset" value="Reset">
            </div>

        </form>
    </main>
